			shellPath = /bin/zsh;
			shellScript = "# Type a script or drag a script file from your work# Type a script or drag a script file from your workspace to insert its path.\ncd \"${SRCROOT}\"\n\n# 获取当前的 tag 总数，作为纯净的构建号\nTAG_COUNT=$(git tag | wc -l | tr -d ' ')\n\n# 容错：空值或非数字按 0 处理，如果是 0 就从 1 开始\nif [ -z \"$TAG_COUNT\" ] || ! [[ \"$TAG_COUNT\" =~ ^[0-9]+$ ]] || [ \"$TAG_COUNT\" -eq 0 ]; then\n    BUILD_NUMBER=1\nelse\n    BUILD_NUMBER=$TAG_COUNT\nfi\n\n# 优先用 Xcode 提供的构建目录变量，找不到再兜底\nif [ -f \"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\" ]; then\n    PLIST_PATH=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nelif [ -f \"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Info.plist\" ]; then\n    PLIST_PATH=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Info.plist\"\nelse\n    echo \"❌ 找不到 Info.plist，请检查 Build Settings 里的配置\"\n    exit 1\nfi\n\n# 写入 CFBundleVersion\n/usr/libexec/PlistBuddy -c \"Set :CFBundleVersion $BUILD_NUMBER\" \"$PLIST_PATH\"\n\n# 使用环境变量自动获取当前 Target 名字，再也不怕复制粘贴穿帮了\necho \"✅ ${TARGET_NAME} CFBundleVersion = $BUILD_NUMBER (tags=$TAG_COUNT)\"\n";
		};
